    required: false
    deprecationMessage: "anthropic_workspace_id was removed in pi-agent-action and fails the run. See https://github.com/lw396/pi-agent-action#migrating-from-claude-code-action"
  anthropic_oidc_audience:
    description: "Removed in pi-agent-action. Setting it fails the run."
    required: false
    deprecationMessage: "anthropic_oidc_audience was removed in pi-agent-action and fails the run. See https://github.com/lw396/pi-agent-action#migrating-from-claude-code-action"
  use_bedrock:
    description: "Removed in pi-agent-action. Setting it fails the run."
    required: false
    deprecationMessage: "use_bedrock was removed in pi-agent-action and fails the run. See https://github.com/lw396/pi-agent-action#migrating-from-claude-code-action"
  use_vertex:
