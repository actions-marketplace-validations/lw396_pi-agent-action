name: "Pi Agent Action"
description: "Run the pi coding agent on GitHub issues and PRs with any model: answer @pi mentions, review code and run automations."
branding:
  icon: "at-sign"
  color: "orange"

inputs:
  trigger_phrase:
    description: "The trigger phrase to look for in comments or issue body"
    required: false
    default: "@pi"
  assignee_trigger:
    description: "The assignee username that triggers the action (e.g. @pi)"
    required: false
  label_trigger:
    description: "The label that triggers the action (e.g. pi)"
    required: false
    default: "pi"
  base_branch:
    description: "The branch to use as the base/source when creating new branches (defaults to repository default branch)"
    required: false
  branch_prefix:
    description: "The prefix to use for branches created by the action (defaults to 'pi/', use 'pi-' for dash format)"
    required: false
    default: "pi/"
  branch_name_template:
    description: "Template for branch naming. Available variables: {{prefix}}, {{entityType}}, {{entityNumber}}, {{timestamp}}, {{sha}}, {{label}}, {{description}}. {{label}} will be first label from the issue/PR, or {{entityType}} as a fallback. {{description}} will be the first 5 words of the issue/PR title in kebab-case. Default: '{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}'"
    required: false
    default: ""
  allowed_bots:
    description: "Comma-separated list of allowed bot usernames, or '*' to allow all bots. Empty string (default) allows no bots. WARNING: On public repos with '*', external Apps may be able to invoke this action with prompts they control. See docs/security.md."
    required: false
    default: ""
  allowed_non_write_users:
    description: |
      Comma-separated list of usernames to allow without write permissions, or '*' to allow all users.
      Only works when github_token input is provided. WARNING: Use with extreme caution - this
      bypasses security checks and should only be used for workflows with very limited permissions
      (e.g., issue labeling).

      SECURITY: Processing untrusted content exposes the workflow to prompt injection. When this
      input is set, bash commands get only an allowlist of environment variables (see
      allowed_bash_env), and on Linux runners with bubblewrap they run in a sandbox that hides
      the agent's own environment. This reduces but does not eliminate prompt injection risk -
      only use for workflows with very limited permissions and validate all outputs.
    required: false
    default: ""
  allowed_bash_env:
    description: >-
      Environment variables, besides the built-in allowlist, that bash
      commands keep when allowed_non_write_users is set, separated by commas,
      spaces or newlines. Every variable not allowed is removed, including
      provider keys and GH_TOKEN, so git push and gh need GH_TOKEN listed here.
      Has no effect unless allowed_non_write_users is set.
    required: false
    default: ""
  subprocess_isolation:
    description: >-
      Set to 'false' to turn off the environment allowlist and the bubblewrap
      sandbox for bash commands when allowed_non_write_users is set.
    required: false
    default: "true"
  include_comments_by_actor:
    description: "Comma-separated list of actor usernames to INCLUDE in comments. Supports wildcards: '*[bot]' matches all bots, 'dependabot[bot]' matches specific bot. Empty (default) includes all actors."
    required: false
    default: ""
  exclude_comments_by_actor:
    description: "Comma-separated list of actor usernames to EXCLUDE from comments. Supports wildcards: '*[bot]' matches all bots, 'renovate[bot]' matches specific bot. Empty (default) excludes none. If actor is in both lists, exclusion takes priority."
    required: false
    default: ""

  # Agent configuration
  prompt:
    description: "Instructions for the agent. Can be a direct prompt or custom template."
    required: false
    default: ""

  # pi configuration
  model:
    description: "The pi model to run, as provider/id with an optional :<thinking> suffix (e.g. opencode/gpt-6-luna). There is no default model. Pass the provider's API key through the workflow env under pi's variable name (e.g. OPENCODE_API_KEY), or through api_key."
    required: true
  api_key:
    description: "API key for the provider of the model input, used instead of that provider's environment variable. Like pi's --api-key, it is not stored."
    required: false
  pi_args:
    description: "Additional pi command-line flags. Supported: --thinking, --system-prompt, --append-system-prompt, --tools, --exclude-tools, --no-tools, --no-builtin-tools, --no-skills, --no-prompt-templates, --no-context-files. Any other flag fails the run."
    required: false
    default: ""
  skills:
    description: >-
      Agent skills to install with gh skill install, one per line:
      OWNER/REPO followed by a skill name (skill@version to pin it), or
      --all for every skill in the repository; --pin REF and
      --allow-hidden-dirs are also accepted. They are installed outside the
      checkout and loaded even with --no-skills in pi_args. Needs gh on the
      runner; a private repository needs a github_token that can read it.
    required: false
    default: ""
  packages:
    description: >-
      Trusted pi packages, one native source per line: npm:NAME[@VERSION]
      or git:HOST/OWNER/REPO[@REF] (also explicit HTTP(S) after git:).
      Installed outside the checkout for this run only; no settings files
      are read or changed. Explicit package skills and prompts load even
      with --no-skills or --no-prompt-templates in pi_args. Needs npm and
      git for their respective sources. Extensions and dependency install
      scripts run with the action's permissions, not in a tool sandbox.
    required: false
    default: ""
  allowed_tools:
    description: >-
      Tools the agent may use, in Claude Code's rule syntax, separated by
      commas, spaces or newlines: a tool name (Bash, Edit, Write,
      mcp__server__tool, mcp__server__*) or Bash(command:*) for bash
      commands with that prefix.
      Read-only tools (Read, Grep, Glob, LS) are always allowed; any other
      call that matches no rule is blocked, so with no rules the agent cannot
      run bash or change files. A command matched by a Bash(...) pattern must
      be one simple command: &&, ;, |, $(), ${}, backticks, subshells and
      redirections are refused.
      Tag mode adds the tools it needs: the tracking comment tool, git add,
      commit, rm and the push wrapper (or the file ops tools with
      use_commit_signing), file edits inside the working directory except
      .git, and git status, diff, log and show without options that write
      files or run programs.
    required: false
    default: ""
  disallowed_tools:
    description: >-
      Tools the agent may not use, in the same syntax as allowed_tools.
      Checked first: a matching call is blocked even if allowed_tools
      permits it.
    required: false
    default: ""
  json_schema:
    description: >-
      A JSON Schema for an object ("type": "object"). When set, the agent
      submits its result through a submit_result tool whose arguments must
      match the schema, and the result is returned in the structured_output
      output. An agent that stops without submitting is reminded up to 2
      times; after that the run fails.
    required: false
    default: ""

  github_token:
    description: "GitHub token with repo and pull request permissions (optional if using GitHub App)"
    required: false

  additional_permissions:
    description: "Additional GitHub permissions to request (e.g., 'actions: read')"
    required: false
    default: ""
  use_sticky_comment:
    description: "Use just one comment to deliver issue/PR comments"
    required: false
    default: "false"
  classify_inline_comments:
    description: "Buffer inline comments without confirmed=true and classify them (real review vs test/probe) before posting after the session ends. Set to 'false' to post all inline comments immediately (pre-buffering behavior)."
    required: false
    default: "true"
  classify_model:
    description: >-
      The model that classifies buffered inline comments, as provider/id: a
      classifier model (such as opencode/jev-1.13 or typesafe/jev-latest) or
      a chat model. When empty, the model input classifies them. Its
      provider's key comes from the workflow env; api_key only applies to the
      model input's provider. If classification fails, every buffered comment
      is posted.
    required: false
    default: ""
  use_commit_signing:
    description: "Enable commit signing using GitHub's commit signature verification. When false, the agent uses standard git commands"
    required: false
    default: "false"
  ssh_signing_key:
    description: "SSH private key for signing commits. When provided, git will be configured to use SSH signing. Takes precedence over use_commit_signing."
    required: false
    default: ""
  bot_id:
    description: "GitHub user ID to use for git operations (defaults to the pi-agent-action app's bot ID, see src/github/constants.ts)"
    required: false
    default: "339978130"
  bot_name:
    description: "GitHub username to use for git operations (defaults to the pi-agent-action app's bot name)"
    required: false
    default: "pi-agent-action[bot]"
  track_progress:
    description: "Force tag mode with tracking comments for pull_request and issue events. Only applicable to pull_request (opened, synchronize, ready_for_review, reopened, labeled) and issue (opened, edited, labeled, assigned) events."
    required: false
    default: "false"
  path_to_bun_executable:
    description: "Optional path to a custom Bun executable. If provided, skips automatic Bun installation and uses this executable instead. WARNING: Using an incompatible version may cause problems if the action requires specific Bun features. This input is typically not needed unless you're debugging something specific or have unique needs in your environment."
    required: false
    default: ""
  display_report:
    description: >-
      Whether to display the detailed pi Agent Report in the GitHub Job
      Summary, below the run summary (counts, tokens and estimated cost) that
      is always written. Set to 'false' to disable when using custom
      formatting solutions. WARNING: The report outputs model-authored content
      in the GitHub Job Summary. This should only be used in cases where the
      action is used solely with trusted input.
    required: false
    default: "false"
  show_full_output:
    description: "Log every pi event (model responses, tool calls and tool results) as JSON in the job log; a debug rerun does the same. Known secret formats and secret env values are redacted, but WARNING: tool results may still contain secrets or other sensitive information, and these logs are publicly visible in GitHub Actions. Only enable for debugging in non-sensitive environments."
    required: false
    default: "false"

  # Removed Claude Code inputs. They stay declared because a composite action
  # cannot read an undeclared input: the run fails when one is set, with a
  # pointer to the migration table (src/entrypoints/removed-inputs.ts).
  anthropic_api_key:
    description: "Removed in pi-agent-action. Setting it fails the run."
    required: false
    deprecationMessage: "anthropic_api_key was removed in pi-agent-action and fails the run. See https://github.com/lw396/pi-agent-action#migrating-from-claude-code-action"
  claude_code_oauth_token:
    description: "Removed in pi-agent-action. Setting it fails the run."
    required: false
    deprecationMessage: "claude_code_oauth_token was removed in pi-agent-action and fails the run. See https://github.com/lw396/pi-agent-action#migrating-from-claude-code-action"
  anthropic_federation_rule_id:
    description: "Removed in pi-agent-action. Setting it fails the run."
    required: false
    deprecationMessage: "anthropic_federation_rule_id was removed in pi-agent-action and fails the run. See https://github.com/lw396/pi-agent-action#migrating-from-claude-code-action"
  anthropic_organization_id:
