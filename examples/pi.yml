name: pi

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  pi:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@pi')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@pi')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@pi')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@pi') || contains(github.event.issue.title, '@pi')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # Required to get a token of the pi-agent-action app
      actions: read # Required for the agent to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run pi
        id: pi
        uses: lw396/pi-agent-action@v1
        with:
          # Any model pi supports, as provider/model-id
          model: anthropic/<model-id>

          # Optional: Customize the trigger phrase (default: @pi)
          # trigger_phrase: "/pi"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "pi-bot"

          # Optional: Commands the agent may run besides git add/commit/push
          # allowed_tools: "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"

          # Optional: Extra instructions for the agent
          # pi_args: --append-system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

          # Export the redacted session as JSONL and HTML (session_jsonl and
          # session_html outputs). Upload them in a later step: see
          # docs/usage.md#exporting-the-session
          export_session: true
        env:
          # The provider's key, under the variable name pi reads
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
