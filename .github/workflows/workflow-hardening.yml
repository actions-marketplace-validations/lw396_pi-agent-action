# Fails when a workflow job that runs the agent lacks its security settings.
# The rules are in AGENTS.md, "Security hardening for GitHub Actions".
name: Security check for workflows that run the agent

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-hardening:
    name: Check security settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test the security check
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check security settings of workflows that run the agent
        run: python3 .github/scripts/check_workflow_hardening.py
